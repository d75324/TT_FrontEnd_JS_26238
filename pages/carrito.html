<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - Talento Tech Ecommerce</title>
    <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css" />
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../estilos/carrito.css">
    <script src="../script/footer.js" defer></script>
</head>

<body>

    <!-- ==================== HEADER ==================== -->
    <header class="header">
        <a href="../index.html">
            <img src="../img/logo1.png" class="logo" alt="Logo Talento Tech" width="40px" height="40px">
        </a>
        <div>
            <ul id="navbar" class="navbar">
                <li>
                    <a href="../index.html">Home</a>
                </li>
                <li>
                    <a href="tienda.html">Tienda</a>
                </li>
                <li>
                    <a href="#">Blog</a>
                </li>
                <li>
                    <a href="#">Acerca de</a>
                </li>
                <li>
                    <a href="contacto.html">Contacto</a>
                </li>
                <li>
                    <a href="carrito.html">
                        <i class="fa fa-shopping-bag" aria-hidden="true"></i>
                    </a>
                </li>
                <a href="#" id="close" class="close">
                    <i class="far fa-times" aria-hidden="true"></i>
                </a>
            </ul>
        </div>

        <!-- ==== Clase 15 ==== -->
        <div class="mobile">
            <a href="carrito.html">
                <i class="fa fa-shopping-bag" aria-hidden="true"></i>
            </a>
            <i id="bar" class="fas fa-outdent"></i>
        </div>

    </header>

    <main>

        <!-- ==================== TABLA CARRITO ==================== -->
        <section id="cart" class="section-p1">
            <table width="100%">
                <thead>
                    <tr>
                        <td>ELIMINAR</td>
                        <td>IMAGEN</td>
                        <td>PRODUCTO</td>
                        <td>PRECIO</td>
                        <td>CANTIDAD</td>
                        <td>SUBTOTAL</td>
                    </tr>
                </thead>
                <tbody id="tabla_carrito"></tbody>
            </table>
        </section>

        <!-- ==================== CUPÓN Y TOTAL ==================== -->
        <section id="cart-add" class="section-p1">
            <div id="coupon">
                <h3>Aplicar Cupón</h3>
                <div>
                    <input type="text" placeholder="Ingresa tu cupón">
                    <button class="normal">Aplicar</button>
                </div>
            </div>
            <div id="subtotal">
                <h3>Total del Carrito</h3>
                <table>
                    <tr>
                        <td>Subtotal del Carrito</td>
                        <td id="subtotal-carrito">$0.00</td>
                    </tr>
                    <tr>
                        <td>Envío</td>
                        <td>Gratis</td>
                    </tr>
                    <tr>
                        <td><strong>Total</strong></td>
                        <td><strong id="total-carrito">$0.00</strong></td>
                    </tr>
                </table>
                <button class="normal">Proceder al pago</button>
            </div>
        </section>

    </main>

    <!-- ===== FOOTER Unificado ===== -->
    <footer id="footer" class="section-p1"></footer>

    
    <!-- <script src="../script/script.js"></script> -->
    <script src="../script/carrito.js"></script>
    <script src="../script/hamburger.js"></script>
</body>

</html>
