<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda - TalentoTech</title>
    <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css" />
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../estilos/tienda.css">
    <script src="../script/script.js" defer></script>
    <script src="../script/tienda.js" defer></script>
    <script src="../script/toast.js" defer></script>
    <script src="../script/footer.js" defer></script>
</head>

<body>

    <!-- ==================== HEADER ==================== -->
    <header class="header">
        <a href="../index.html">
            <img src="../img/logo1.png" class="logo" alt="Logo Talento Tech" width="40px" height="40px">
        </a>
        <div>
            <ul id="navbar" class="navbar">
                <li><a href="../index.html">Home</a></li>
                <li><a href="tienda.html">Tienda</a></li>
                <li><a href="#">Blog</a></li>
                <li><a href="#">Acerca de</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li>
                    <a href="carrito.html">
                        <i class="fa fa-shopping-bag" aria-hidden="true"></i>
                    </a>
                </li>
                <a href="#" id="close" class="close">
                    <i class="far fa-times" aria-hidden="true"></i>
                </a>
            </ul>
        </div>
        <div class="mobile">
            <a href="carrito.html">
                <i class="fa fa-shopping-bag" aria-hidden="true"></i>
            </a>
            <i id="bar" class="fas fa-outdent"></i>
        </div>
    </header>

    <main>
        <!-- ====== banner tienda ====== -->
        <section class="page-header">
            <h2>Compra Desde Casa</h2>
            <p>¡Aprovechá descuentos de hasta un 50%!</p>
        </section>

        <!-- ====== dibujamos los productos ====== -->
        <section class="section-productos section-p1">
            <div class="productos-container"></div>
        </section>
    </main>

    <!-- TOAST -->
    <div id="toast" class="toast-custom">
        <span id="toastMensaje"></span>
        <button>✕</button>
    </div>

    <!-- ======= MODAL ======= -->
    <div id="overlayModal" class="modal-overlay">
        <div class="modal-custom">
            <button id="btnCerrarModal" class="modal-cerrar">✕</button>
            <img id="modalImagen" src="" alt="">
            <h5 id="modalTitulo"></h5>
            <p id="modalDescripcion"></p>
            <h4 id="modalPrecio"></h4>
        </div>
    </div>

    <!-- ===== FOOTER Unificado ===== -->
    <footer id="footer" class="section-p1"></footer>
    
</body>
</html>
